version: 4

# Class names are read automatically from model metadata / embedded labels.
coral:
  model: /models/model.tflite
  input_size: 512
  device: pci
  # Frigate EdgeTPU yolo-generic interprets class output as logits.
  score_mode: logits
  frigate_compat: true


performance:
  frigate_parity: true

night:
  # Keep night/motion contrast sensitivity, but do not alter the actual image
  # passed to Coral in Frigate parity mode. CLAHE/gamma detector preprocessing
  # can make static IR textures look more object-like and increase false positives.
  motion_contrast_enabled: true
  coral_enhancement: true
  coral_enhancement_mode: weak_motion_only
  # Enhanced weak-night detections may acquire a track immediately. For TP/push,
  # either a subsequent RAW tracker pass must confirm it or these consecutive-hit
  # counts are required. This is source-specific anti-FP, not a global score hike.
  weak_motion_prealert_hits: 3
  weak_motion_confirm_hits: 3

video:
  vaapi_device: /dev/dri/renderD128
  direct_camera_input: auto

events:
  retention_days: 7
  mqtt_update_interval: 30.0
  mqtt_snapshot_update_interval: 2.0
  mqtt_active_update_interval: 2.0
  mqtt_stationary_update_interval: 8.0
  mqtt_min_update_interval: 0.75
  # Current HACS notification JPEG cadence. First hit is always immediate.
  notification_frame_interval: 1.25

home_assistant:
  api_enabled: true
  private_network_only: true

mqtt:
  enabled: false
  host: broker.example.invalid
  port: 1883
  user: CHANGE_ME
  password: CHANGE_ME
  prefix: ainvr

go2rtc:
  api:
    listen: :1984
  rtsp:
    listen: :8554
  streams:
    kamera_1:
      - rtsp://user:CHANGE_ME@camera.example.invalid:554/cam/realmonitor?channel=1&subtype=0#media=video#backchannel=0

notifications:
  enabled: true

cameras:
  kamera_1:
    enabled: true
    stream: kamera_1
    detect:
      width: 1920
      height: 1080
      fps: 5
      stationary_classifier: true
      stationary_threshold_seconds: 10
      stationary_interval_seconds: 10
    objects:
      track:
        - person
        - car
      filters:
        person:
          min_score: 0.50
          threshold: 0.70
        car:
          min_score: 0.50
          threshold: 0.70
    motion:
      frame_height: 512
      threshold: 30
      contour_area: 10
      threshold_night: 20
      contour_area_night: 6
      night_improve_contrast: true
      wind_guard_enabled: true
      adaptive_region_grid_enabled: true
